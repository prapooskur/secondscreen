[package]
name = "secondscreen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A desktop control panel for ultrawide secondary displays"

[features]
default = ["ui-gpui"]
ui-gpui = ["dep:gpui"]
ui-gpui-fast = ["dep:gpui-fast-backend", "dep:gpui-fast-platform"]

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
log = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["component", "gpu", "network", "system"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", optional = true, default-features = false, features = ["wayland"] }
gpui-fast-backend = { package = "gpui-fast", version = "0.1.17", optional = true, default-features = false, features = ["wayland", "font-kit"] }
gpui-fast-platform = { version = "0.1.17", optional = true, default-features = false, features = ["wayland"] }
blocking = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rustix = { version = "1", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
zbus = "5.15"
