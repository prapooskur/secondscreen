[package]
name = "secondscreen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A desktop control panel for ultrawide secondary displays"
repository = "https://github.com/prapooskur/secondscreen"

[package.metadata.deb]
maintainer = "Prasiddh <61389919+prapooskur@users.noreply.github.com>"
section = "utils"
depends = "$auto, libvulkan1, libwebkit2gtk-4.1-0, pulseaudio-utils, wl-clipboard"
recommends = "evolution-data-server, gstreamer1.0-plugins-good, gstreamer1.0-libav"
assets = [
    ["target/release/secondscreen", "usr/bin/secondscreen", "755"],
    ["packaging/io.github.secondscreen.desktop", "usr/share/applications/", "644"],
    ["packaging/io.github.secondscreen.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/io.github.secondscreen.metainfo.xml", "usr/share/metainfo/", "644"],
    ["assets/fonts/*-OFL.txt", "usr/share/doc/secondscreen/", "644"],
]

[package.metadata.generate-rpm]
license = "Unspecified"
assets = [
    { source = "target/release/secondscreen", dest = "/usr/bin/secondscreen", mode = "755" },
    { source = "packaging/io.github.secondscreen.desktop", dest = "/usr/share/applications/", mode = "644" },
    { source = "packaging/io.github.secondscreen.svg", dest = "/usr/share/icons/hicolor/scalable/apps/", mode = "644" },
    { source = "packaging/io.github.secondscreen.metainfo.xml", dest = "/usr/share/metainfo/", mode = "644" },
    { source = "assets/fonts/*-OFL.txt", dest = "/usr/share/licenses/secondscreen/", mode = "644" },
]

[package.metadata.generate-rpm.requires]
evolution-data-server = "*"
vulkan-loader = "*"
"libwebkit2gtk-4.1.so.0()(64bit)" = "*"
pulseaudio-utils = "*"
wl-clipboard = "*"

[package.metadata.generate-rpm.recommends]
gstreamer1-plugins-good = "*"
gstreamer1-plugin-libav = "*"

[features]
default = ["ui-gpui"]
ui-gpui = ["dep:gpui"]
ui-gpui-fast = ["dep:gpui-fast-backend", "dep:gpui-fast-platform"]

[dependencies]
anyhow = "1"
async-channel = "2"
env_logger = "0.11"
log = "0.4"
sysinfo = { version = "0.40", default-features = false, features = ["component", "gpu", "network", "system"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "background"] }
async-io = "2"
gpui = { version = "0.2.2", optional = true, default-features = false, features = ["wayland"] }
gpui-fast-backend = { package = "gpui-fast", version = "0.1.17", optional = true, default-features = false, features = ["wayland", "font-kit"] }
gpui-fast-platform = { version = "0.1.17", optional = true, default-features = false, features = ["wayland"] }
blocking = "1"
base64 = "0.22"
futures-lite = "2"
jiff = { version = "0.2", default-features = false, features = ["serde", "std", "tz-system", "tzdb-zoneinfo"] }
freedesktop-icons = "0.4"
oo7 = { version = "0.5", default-features = false, features = ["async-std", "native_crypto"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }
rustix = { version = "1", features = ["event", "fs", "process", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
url = "2"
wayland-client = "0.31"
zbus = "5.15"
html5ever = "0.39"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
